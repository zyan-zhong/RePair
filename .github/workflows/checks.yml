name: Reproduction and source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Verify public and registered sources
        run: |
          python tools/verify_release.py
          python tools/verify_registered_sources.py
      - name: Recount paper results
        run: python paper/reproduce_results.py
      - name: Framework regression suite
        run: |
          make -C native/s1_backend_probe all
          python tools/test_public_framework.py
      - name: Current strategy regression suite
        run: python tools/test_current_strategy.py
