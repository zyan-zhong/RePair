[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pchsi"
version = "0.0.0"
description = "Phase-Critical Harness-Guided Self-Improvement research tooling"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
